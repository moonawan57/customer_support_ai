<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="chat-container">
        <header>
            <h2>Customer Support AI</h2>
            <p>Instant replies, FAQs & complaint handling</p>
        </header>
        
        <div id="chat-box" class="chat-box">
            <div class="message bot-message">Hello! How can I help you today? You can ask a question, check FAQs, or file a complaint.</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your query or complaint..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
